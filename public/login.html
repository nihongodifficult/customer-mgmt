<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — 予約管理システム</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
    font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo .logo-icon { font-size: 40px; margin-bottom: 8px; }
  .login-logo h1 { font-size: 18px; font-weight: 700; color: #1e1b4b; }
  .login-logo p { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-size: 15px;
    color: #1e1b4b;
    transition: border-color .2s;
    outline: none;
  }
  input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.15); }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s, transform .1s;
  }
  .btn-login:hover { background: #6d28d9; }
  .btn-login:active { transform: scale(.98); }
  .error-msg {
    color: #dc2626;
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="logo-icon">💜</div>
    <h1>予約管理システム</h1>
    <p>E+ アイドルスクール</p>
  </div>
  <form method="POST" action="/auth/login">
    <div class="form-group">
      <label for="user">ユーザー名</label>
      <input id="user" name="user" type="text" autocomplete="username" required placeholder="ユーザー名を入力">
    </div>
    <div class="form-group">
      <label for="pass">パスワード</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required placeholder="パスワードを入力">
    </div>
    <button class="btn-login" type="submit">ログイン</button>
    <div class="error-msg" id="errMsg"></div>
  </form>
</div>
<script>
  // URLにerrorパラメータがあればエラー表示
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('errMsg').textContent = 'ユーザー名またはパスワードが違います';
  }
</script>
</body>
</html>
