<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — GREED 予約管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060608;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* 背景の微細なゴールドグロー */
  body::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(201,168,76,.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .login-card {
    position: relative;
    background: #0e0e1a;
    border: 1px solid rgba(201,168,76,.25);
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,76,.08);
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,.5), transparent);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 36px;
  }
  .login-logo img {
    height: 52px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(201,168,76,.4));
  }
  .login-logo p {
    font-size: 12px;
    color: rgba(201,168,76,.55);
    margin-top: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: rgba(201,168,76,.7);
    margin-bottom: 7px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(201,168,76,.18);
    border-radius: 10px;
    font-size: 15px;
    color: #e8dcc8;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  input::placeholder { color: rgba(232,220,200,.3); }
  input:focus {
    border-color: rgba(201,168,76,.6);
    box-shadow: 0 0 0 3px rgba(201,168,76,.1);
    background: rgba(255,255,255,.06);
  }
  .divider {
    height: 1px;
    background: rgba(201,168,76,.1);
    margin: 24px 0;
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #C9A84C, #B5943A);
    color: #060608;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .04em;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(201,168,76,.3);
  }
  .btn-login:hover {
    opacity: .92;
    box-shadow: 0 6px 28px rgba(201,168,76,.45);
  }
  .btn-login:active { transform: scale(.98); }
  .error-msg {
    color: #f87171;
    font-size: 12px;
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
    letter-spacing: .02em;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="/img/greed-logo-new.png" alt="GREED" style="filter:invert(1) drop-shadow(0 0 12px rgba(201,168,76,.4))">
    <p>予約管理システム</p>
  </div>
  <form method="POST" action="/auth/login">
    <div class="form-group">
      <label for="user">ユーザー名</label>
      <input id="user" name="user" type="text" autocomplete="username" required placeholder="ユーザー名を入力">
    </div>
    <div class="form-group">
      <label for="pass">パスワード</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required placeholder="パスワードを入力">
    </div>
    <div class="divider"></div>
    <button class="btn-login" type="submit">ログイン</button>
    <div class="error-msg" id="errMsg"></div>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('errMsg').textContent = 'ユーザー名またはパスワードが違います';
  }
</script>
</body>
</html>
